<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夜文法">
<meta name="theme-color" content="#0F1113">
<title>夜文法 ｜ 視覺原型</title>
<style>
/* ── 三個深色方向 ───────────────────────────────── */
:root{
  --r-card:14px;
  --f-go:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-mi:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-num:ui-monospace,"SF Mono",Menlo,monospace;
}
[data-dir="keiki"]{
  --bg:#0F1113; --bg2:#171A1D; --bg3:#1E2226;
  --tx:#DDE2E4; --tx2:#8E969A; --tx3:#5D6569;
  --sig:#E8A33D; --sig-dim:#7A5A26;
  --rule:#272C30; --rule2:#343A3F;
  --ok:#7FB2A0; --ng:#D2705F;
}
[data-dir="hanshita"]{
  --bg:#14161F; --bg2:#1C1F2B; --bg3:#242835;
  --tx:#E4E0D8; --tx2:#948FA3; --tx3:#615D70;
  --sig:#E2564C; --sig-dim:#75302E;
  --rule:#2A2E3C; --rule2:#373C4D;
  --ok:#8FA9C4; --ng:#E2564C;
}
[data-dir="joyato"]{
  --bg:#191512; --bg2:#221D18; --bg3:#2A241E;
  --tx:#E8DDCD; --tx2:#A3947F; --tx3:#6E6355;
  --sig:#7FA88B; --sig-dim:#3E5546;
  --rule:#2E271F; --rule2:#3C3428;
  --ok:#7FA88B; --ng:#C98A6A;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-go);
  background:var(--bg); color:var(--tx);
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:background .4s ease, color .4s ease;
  line-height:1.75;
}
::selection{background:var(--sig-dim);color:var(--tx)}
:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

.wrap{
  min-height:100dvh; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:var(--fw,560px); margin:0 auto;
  position:relative;
}

/* ── 刻度レール ─────────────────────────────────── */
.rail{
  display:flex; align-items:flex-end; gap:2px; height:22px;
  padding:10px 20px 0 20px; flex-shrink:0;
}
.rail i{
  flex:1; height:11px; background:var(--rule2); border-radius:0;
  transform:scaleY(.273); transform-origin:bottom;
  transition:transform .25s ease, background .25s ease;
}
.rail i.done{background:var(--sig-dim)}
.rail i.now{transform:scaleY(1);background:var(--sig)}

/* ── 版面 ───────────────────────────────────────── */
.stage{flex:1; display:flex; min-height:0}
.margin{
  width:38px; flex-shrink:0; padding-top:25px;
  display:flex; flex-direction:column; align-items:center; gap:9px;
  border-right:1px solid var(--rule);
}
.mk{font-family:var(--f-num); font-size:10.5px; letter-spacing:.03em; color:var(--sig)}
.mk.mute{color:var(--tx3)}
.mtick{width:10px;height:1px;background:var(--rule2)}
.mtick.on{background:var(--sig)}
.body{
  flex:1; min-width:0; padding:24px 20px 26px 18px; overflow-y:auto;
  display:flex; flex-direction:column;
}
.inner{width:100%}
.inner.mid{margin:auto 0}

/* ── 共通字體 ───────────────────────────────────── */
.lbl{font-size:11px;letter-spacing:.14em;color:var(--tx3);font-family:var(--f-num)}
.ja{font-family:var(--f-mi); font-size:19px; line-height:1.95; letter-spacing:.01em}
.ja.go{font-family:var(--f-go)}
.rd{font-size:12.5px;color:var(--tx3);line-height:1.7;margin-top:2px;font-family:var(--f-go)}
[data-rd="0"] .rd{display:none}
.zh{font-size:13.5px;color:var(--tx2);line-height:1.7;margin-top:4px}
.zhx{display:block;font-size:13px;color:var(--tx2);line-height:1.8;margin-top:5px}
.meta .zhx{font-size:12.5px;color:var(--tx3);margin-top:3px}
.vwhen .zhx{font-size:12px;color:var(--tx3);margin-top:2px}
[data-zh="0"] .zhx{display:none}
mark{background:none;color:var(--sig);font-weight:600}

/* ── 卡片區塊 ───────────────────────────────────── */
.h1{font-size:27px;line-height:1.4;font-weight:600;letter-spacing:.01em}
.h2{font-size:22px;line-height:1.5;font-weight:600;font-family:var(--f-mi)}
.intro{font-size:15px;color:var(--tx2);margin-top:14px;line-height:1.9;max-width:34em}
.meta{margin-top:18px;display:flex;flex-direction:column;gap:7px}
.meta div{display:flex;gap:10px;font-size:13px;align-items:baseline}
.meta b{font-weight:500;color:var(--tx3);flex-shrink:0;width:3.6em;font-size:11.5px;letter-spacing:.08em}
.meta span{color:var(--tx2);line-height:1.7}
.ex{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.ex li{list-style:none;padding-left:13px;border-left:1px solid var(--rule2)}
ul.cons{margin-top:8px;display:flex;flex-direction:column;gap:11px}
ul.cons li{
  list-style:none;font-size:14px;color:var(--tx);line-height:1.8;
  padding-left:17px;position:relative;
}
ul.cons li::before{
  content:"";position:absolute;left:0;top:.72em;width:7px;height:1px;background:var(--sig);
}
.contrast{
  margin-top:20px;padding:14px 15px;background:var(--bg2);border-radius:var(--r-card);
  font-size:14px;line-height:1.85;color:var(--tx2);
}
.contrast em{font-style:normal;color:var(--tx);font-family:var(--f-mi)}

/* ── 單字 ───────────────────────────────────────── */
.word{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.word .w{font-family:var(--f-mi);font-size:34px;line-height:1.3;letter-spacing:.02em}
.pos{
  font-size:11px;letter-spacing:.1em;color:var(--sig);border:1px solid var(--sig-dim);
  padding:2px 7px;border-radius:3px;font-family:var(--f-go);white-space:nowrap;
}
.wr{font-size:14px;color:var(--tx3);margin-top:6px}
.wz{font-size:17px;color:var(--tx);margin-top:12px}
.note{margin-top:16px;font-size:13px;color:var(--tx2);line-height:1.8;padding-top:14px;border-top:1px solid var(--rule)}

/* ── 言い換え：刻度尺 ───────────────────────────── */
.scale{margin:22px 0 6px;position:relative;padding-bottom:26px}
.scale .bar{height:1px;background:var(--rule2);position:relative;margin:0 4px}
.scale .tick{
  position:absolute;top:-7px;width:1px;height:15px;background:var(--rule2);
  transform:translateX(-50%) scaleY(.6);transform-origin:bottom;
  transition:background .3s ease,transform .3s ease;
}
.scale .tick.on{background:var(--sig);transform:translateX(-50%) scaleY(1)}
.scale .cap{
  position:absolute;top:14px;font-size:10px;color:var(--tx3);
  transform:translateX(-50%);white-space:nowrap;font-family:var(--f-go);
  transition:color .3s ease;
}
.scale .cap.on{color:var(--sig)}
.intent{
  font-size:15px;color:var(--tx2);line-height:1.85;
  padding:14px 15px;background:var(--bg2);border-radius:var(--r-card);
}
.intent b{display:block;font-size:11px;letter-spacing:.14em;color:var(--tx3);
  font-family:var(--f-num);font-weight:400;margin-bottom:7px}
.ask{margin-top:22px;font-size:16px;color:var(--sig);line-height:1.8}
.hint{margin-top:9px;font-size:12.5px;color:var(--tx3)}
.vlist{margin-top:22px;display:flex;flex-direction:column;gap:19px}
.vitem{padding-left:14px;border-left:1px solid var(--rule2)}
.vitem.anchor{border-left-color:var(--sig)}
.vlist.slim{gap:13px}
.vlist.slim .ja{font-size:17px;line-height:1.75}
.vlvl{font-size:11px;letter-spacing:.1em;color:var(--sig);margin-bottom:5px;font-family:var(--f-go)}
.vwhen{font-size:12px;color:var(--tx3);margin-top:5px;line-height:1.7}
.lever{
  margin-top:24px;padding:16px 16px;background:var(--bg2);border-radius:var(--r-card);
}
.lever b{display:block;font-size:11px;letter-spacing:.14em;color:var(--sig);
  font-family:var(--f-num);font-weight:400;margin-bottom:9px}
.lever p{font-size:14px;line-height:1.95;color:var(--tx)}
.lever em{font-style:normal;color:var(--sig);font-weight:600}

/* ── 複習 ───────────────────────────────────────── */
.q{font-family:var(--f-mi);font-size:21px;line-height:1.9;margin-top:6px}
.opts{margin-top:26px;display:flex;flex-direction:column;gap:11px}
.opt{
  background:var(--bg2);border:1px solid var(--rule);color:var(--tx);
  font-family:var(--f-mi);font-size:18px;padding:15px 17px;border-radius:10px;
  text-align:left;cursor:pointer;width:100%;transition:border-color .2s ease,background .2s ease;
}
.opt:active{background:var(--bg3)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.ng{border-color:var(--ng);color:var(--ng)}
.opt:disabled{cursor:default;opacity:1}
.why{margin-top:18px;font-size:14px;line-height:1.85;color:var(--tx2)}

/* ── 首頁與完了 ─────────────────────────────────── */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px}
.daynum{font-family:var(--f-num);font-size:12px;letter-spacing:.2em;color:var(--sig)}
.big{font-family:var(--f-mi);font-size:38px;line-height:1.35;margin-top:12px;letter-spacing:.02em}
.grp{font-size:13px;color:var(--tx3);margin-top:12px;letter-spacing:.06em}

/* ── 底部 ───────────────────────────────────────── */
.foot{
  flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
}
.back{
  background:none;border:none;padding:8px;margin:-8px;cursor:pointer;
  color:var(--tx3);display:flex;line-height:0;
}
.back:disabled{opacity:.22}
.count{font-family:var(--f-num);font-size:11px;color:var(--tx3);letter-spacing:.08em}
.spacer{flex:1}
.btn{
  background:var(--sig);color:var(--bg);border:none;font-family:var(--f-go);
  font-size:16px;font-weight:600;padding:15px 34px;border-radius:var(--r-card);
  cursor:pointer;letter-spacing:.04em;
}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:none;color:var(--tx2);border:1px solid var(--rule2);font-weight:400}
.tapzone{position:absolute;inset:0;cursor:pointer;z-index:1}

/* ── 原型控制列（正式版不會有） ─────────────────── */
.proto{
  flex-shrink:0;border-top:1px solid var(--rule);background:var(--bg);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:7px;align-items:center;position:relative;z-index:3;
}
.proto span{font-size:9.5px;color:var(--tx3);letter-spacing:.1em;font-family:var(--f-num);margin-right:2px}
.proto button{
  flex:1;background:var(--bg2);border:1px solid var(--rule);color:var(--tx2);
  font-family:var(--f-go);font-size:12px;padding:9px 4px;border-radius:8px;cursor:pointer;
}
.proto button.on{border-color:var(--sig);color:var(--sig)}
.fade{animation:fi .26s cubic-bezier(.16,1,.3,1)}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>

<!--
THESIS: 一課是一張印刷指定紙，語感是一支有刻度的量尺。拒絕語言 app 的兩個既定長相：
Duolingo 式的圓角遊戲化卡片，與 Anki 式的灰白極簡表單。
OWN-WORLD: 版下（印刷指定紙）× 夜間計器盤。左側留白欄放朱書き式的邊註，頂部是逐卡點亮的
刻度レール，言い換え用五段檢刻的量尺。明朝體承載日文內容，ゴシック承載介面，
字體本身就是語感軸線的一部分。三個夜間光線方向：計器、版下、常夜灯。
STORY: 他躺著看見今天要學什麼，一路點過去，在言い換えカード先自己想一遍再對答案，
最後知道語感差異是哪個槓桿造成的。
FIRST VIEWPORT: 課號在上方以等寬數字小字標示，單元名以明朝大字居中偏上，
主題群在其下，底部單一「はじめる」按鈕落在拇指自然位置。
FORM: 印刷指定紙與計器盤的融合，自七個候選中選出（抽籤腳本在 Windows 無輸出，已告知）。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

const LEVELS=["くだけた","普通","丁寧","改まった","格式"];
const DIRS=["keiki","hanshita","joyato"];
const app=document.getElementById("app");
let day=1,idx=0,stage=0,answered={};

/* 卡片序列 */
function cards(d){
  const c=[{t:"topic"}];
  d.patterns.forEach((p,i)=>{c.push({t:"pattern",i});c.push({t:"cons",i})});
  d.vocab.forEach((v,i)=>c.push({t:"vocab",i}));
  c.push({t:"para"});
  d.review.forEach((r,i)=>c.push({t:"review",i}));
  c.push({t:"done"});
  return c;
}
const esc=s=>s.replace(/[&<]/g,m=>({"&":"&amp;","<":"&lt;"}[m]));
const ARROW='<svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 4.5 6.5 9.5l5 5"/></svg>';
const SCALEMARK='<svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" style="color:var(--sig)"><path d="M.5 8h14M3 8V4M7.5 8V2.5M12 8V5"/></svg>';
const REVMARK='<svg width="13" height="10" viewBox="0 0 13 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tx3)"><path d="M12.5 1v2.5a2 2 0 0 1-2 2H1.5M4 3 1.5 5.5 4 8"/></svg>';
const dayMark=n=>`<div class="mk mute">${String(n).padStart(3,"0")}</div>`;
/* 雙語欄位：字串視為只有日文，物件則日文在上中文在下 */
const bi=o=>typeof o==="string"?o:o.ja+(o.zh?`<span class="zhx">${o.zh}</span>`:"");

function railHTML(n,cur){
  let s='<div class="rail">';
  for(let i=0;i<n;i++)s+=`<i class="${i<cur?"done":i===cur?"now":""}"></i>`;
  return s+"</div>";
}
function exHTML(list,mincho){
  return '<ul class="ex">'+list.map(e=>
    `<li><div class="ja${mincho?"":" go"}">${esc(e.ja)}</div>`+
    `<div class="rd">${esc(e.rd)}</div><div class="zh">${esc(e.zh)}</div></li>`).join("")+"</ul>";
}

function render(){
  const d=DATA[day],seq=cards(d),c=seq[idx];
  let margin="",body="",foot="",tap=true;

  if(c.t==="topic"){
    margin=dayMark(d.day);
    body=`<div class="lbl">${esc(d.group)}</div>
      <h1 class="h1" style="margin-top:10px;font-family:var(--f-mi)">${esc(d.unit)}</h1>
      <p class="intro">${bi(d.intro)}</p>`;
  }
  else if(c.t==="pattern"){
    const p=d.patterns[c.i];
    margin=dayMark(d.day)+`<div class="mk">${p.id}</div><div class="mtick on"></div>`;
    body=`<div class="h2">${esc(p.pattern)}</div>
      <div class="meta">
        <div><b>接続</b><span>${bi(p.conjugation)}</span></div>
        <div><b>意味</b><span>${bi(p.meaning)}</span></div>
        <div><b>文体</b><span>${bi(p.register)}</span></div>
      </div>${exHTML(p.examples,true)}`;
  }
  else if(c.t==="cons"){
    const p=d.patterns[c.i];
    margin=dayMark(d.day)+`<div class="mk">${p.id}</div><div class="mtick"></div><div class="mtick on"></div>`;
    body=`<div class="lbl">使用制限</div>
      <div class="h2" style="margin-top:8px;font-size:19px">${esc(p.pattern)}</div>
      <ul class="cons">${p.constraints.map(x=>`<li>${bi(x)}</li>`).join("")}</ul>
      <div class="contrast">${bi(p.contrast)}</div>`;
  }
  else if(c.t==="vocab"){
    const v=d.vocab[c.i];
    margin=dayMark(d.day)+`<div class="mk">${String(c.i+1).padStart(2,"0")}<span style="color:var(--tx3)">/${d.vocab.length}</span></div>`;
    body=`<div class="word"><div class="w">${esc(v.w)}</div><div class="pos">${esc(v.pos)}</div></div>
      <div class="wr">${esc(v.r)}</div>
      <div class="wz">${esc(v.zh)}</div>
      <ul class="ex" style="margin-top:24px"><li><div class="ja">${esc(v.ex.ja)}</div>
      <div class="zh">${esc(v.ex.zh)}</div></li></ul>
      <div class="note">${bi(v.note)}</div>`;
  }
  else if(c.t==="para"){
    const p=d.paraphrase;
    margin=dayMark(d.day)+SCALEMARK;
    const pos=l=>LEVELS.indexOf(l), used=p.variants.map(v=>pos(v.level));
    let sc='<div class="scale"><div class="bar">';
    LEVELS.forEach((l,i)=>{
      const x=(i/(LEVELS.length-1))*100;
      const on=stage>=1&&used.includes(i);
      sc+=`<div class="tick${on?" on":""}" style="left:${x}%"></div>`;
      sc+=`<div class="cap${on?" on":""}" style="left:${x}%">${l}</div>`;
    });
    sc+="</div></div>";
    const anchor=p.variants.find(v=>v.level==="丁寧")||p.variants[1];
    body=`<div class="lbl">言い換え ｜ ${esc(p.axis)}の軸</div>${sc}
      <div class="intent"><b>伝えたい内容</b>${esc(p.intent)}</div>`;
    if(stage===0){
      body+=`<div class="vlist"><div class="vitem anchor">
        <div class="vlvl">いま言えるところ</div>
        <div class="ja go">${esc(anchor.ja)}</div><div class="rd">${esc(anchor.rd)}</div></div></div>
        <div class="ask">${p.axis==="硬さ"?"もっとくだけては？　もっと改まっては？":"もっとぼかすには？　もっと精密にするには？"}</div>
        <div class="hint">口に出さなくていい。心の中で一度言ってから進む。</div>`;
    }else if(stage===1){
      body+='<div class="vlist">'+p.variants.map(v=>
        `<div class="vitem"><div class="vlvl">${esc(v.level)}</div>
        <div class="ja${v.go?" go":""}">${esc(v.ja)}</div>
        <div class="rd">${esc(v.rd)}</div><div class="zh">${esc(v.zh)}</div>
        <div class="vwhen">${bi(v.when)}</div></div>`).join("")+"</div>";
    }else{
      body+='<div class="vlist slim">'+p.variants.map(v=>
        `<div class="vitem"><div class="vlvl">${esc(v.level)}</div>
        <div class="ja${v.go?" go":""}">${esc(v.ja)}</div></div>`).join("")+"</div>"+
        `<div class="lever"><b>何が効いたか　この差はどこから来たか</b><p>${bi(p.lever)}</p></div>`;
    }
  }
  else if(c.t==="review"){
    const r=d.review[c.i],key=day+"-"+c.i,a=answered[key];
    margin=dayMark(d.day)+REVMARK+`<div class="mk mute">${String(r.fromDay).padStart(3,"0")}</div>`;
    body=`<div class="lbl">かるい復習 ${c.i+1} / ${d.review.length}</div>
      <div class="q">${esc(r.q)}</div><div class="opts">`+
      r.options.map((o,i)=>{
        let cl="opt";
        if(a!==undefined)cl+= i===r.answer?" ok":(i===a?" ng":"");
        return `<button class="${cl}" data-opt="${i}" ${a!==undefined?"disabled":""}>${esc(o)}</button>`;
      }).join("")+"</div>";
    if(a!==undefined)body+=`<div class="why">${bi(r.why)}</div>`;
    tap = a!==undefined;
  }
  else if(c.t==="done"){
    margin=dayMark(d.day);
    body=`<div class="daynum">第 ${String(d.day).padStart(3,"0")} 課　完了</div>
      <div class="big" style="font-size:29px">${esc(d.unit)}</div>
      <div style="margin-top:30px;display:flex;flex-direction:column;gap:13px">
      ${d.patterns.map(p=>`<div style="display:flex;gap:14px;align-items:baseline">
        <span class="lbl" style="width:2.2em;flex-shrink:0">${p.id}</span>
        <span style="font-family:var(--f-mi);font-size:17px">${esc(p.pattern)}</span></div>`).join("")}
      </div>
      <div class="grp" style="margin-top:32px">明日：第 ${d.day+1} 課</div>`;
    tap=false;
    foot=`<button class="btn ghost" id="again">もう一度</button><div class="spacer"></div>
          <button class="btn" id="home">おわり</button>`;
  }

  const total=seq.length;
  if(!foot)foot=`<button class="back" id="back" ${idx===0?"disabled":""}>${ARROW}</button>
    <div class="count">${String(idx+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}</div>
    <div class="spacer"></div>
    <div class="count" style="color:var(--tx3)">${c.t==="para"&&stage<2?"タップで続き":"タップで次へ"}</div>`;

  app.innerHTML=railHTML(total,idx)+
    `<div class="stage"><div class="margin">${margin}</div>
     <div class="body"><div class="inner fade${c.t==="topic"||c.t==="done"?" mid":""}">${body}</div></div></div>
     <div class="foot">${foot}</div>`+
    (tap?'<div class="tapzone" id="tz"></div>':"");

  const tz=document.getElementById("tz");
  if(tz)tz.onclick=()=>{ if(Date.now()-swipedAt>400)next(); };
  const b=document.getElementById("back");
  if(b)b.onclick=e=>{e.stopPropagation();prev()};
  app.querySelectorAll("[data-opt]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    answered[day+"-"+cards(DATA[day])[idx].i]=+el.dataset.opt;render();
  });
  const ag=document.getElementById("again");
  if(ag)ag.onclick=()=>{idx=0;stage=0;answered={};render()};
  const hm=document.getElementById("home");
  if(hm)hm.onclick=()=>{idx=0;stage=0;answered={};render()};
}
function next(){
  const seq=cards(DATA[day]),c=seq[idx];
  if(c.t==="para"&&stage<2){stage++;render();return}
  if(idx<seq.length-1){idx++;stage=0;render()}
}
function prev(){
  const c=cards(DATA[day])[idx];
  if(c.t==="para"&&stage>0){stage--;render();return}
  if(idx>0){idx--;stage=cards(DATA[day])[idx].t==="para"?2:0;render()}
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" ")next();
  if(e.key==="ArrowLeft")prev();
});
/* 左右滑動。垂直捲動優先，斜著滑不算 */
let sx=0,sy=0,swipedAt=0;
app.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;
},{passive:true});
app.addEventListener("touchend",e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6){
    swipedAt=Date.now();
    if(dx<0)next(); else prev();
  }
},{passive:true});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
  document.body.dataset.dir=b.dataset.d;
  document.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("on",x===b));
});
const rdBtn=document.getElementById("rdtog"),zhBtn=document.getElementById("zhtog");
rdBtn.onclick=()=>{
  const on=document.body.dataset.rd!=="0";
  document.body.dataset.rd=on?"0":"1";
  rdBtn.classList.toggle("on",!on);
};
zhBtn.onclick=()=>{
  const on=document.body.dataset.zh!=="0";
  document.body.dataset.zh=on?"0":"1";
  zhBtn.classList.toggle("on",!on);
};
document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
  day=+b.dataset.day;idx=0;stage=0;answered={};
  document.querySelectorAll("[data-day]").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
/* 網址參數：?dir=keiki|hanshita|joyato &day=1|7 &i=卡片序號 &s=言い換え段階 */
const qs=new URLSearchParams(location.search);
const qd=qs.get("dir"); if(qd&&DIRS.includes(qd))document.body.dataset.dir=qd;
const qw=+qs.get("w"); if(qw>=280&&qw<=560)document.documentElement.style.setProperty("--fw",qw+"px");
const qy=+qs.get("day"); if(DATA[qy])day=qy;
const qi=+qs.get("i"); if(qi>=0&&qi<cards(DATA[day]).length)idx=qi;
const q3=+qs.get("s"); if(q3>=0&&q3<=2)stage=q3;
document.body.dataset.rd=qs.get("rd")==="0"?"0":"1";
document.body.dataset.zh=qs.get("zh")==="0"?"0":"1";
if(document.body.dataset.rd==="1")document.getElementById("rdtog").classList.add("on");
if(document.body.dataset.zh==="1")document.getElementById("zhtog").classList.add("on");
if(qs.get("ans")==="1")DATA[day].review.forEach((r,i)=>answered[day+"-"+i]=r.answer);
document.querySelector(`[data-d="${document.body.dataset.dir}"]`).classList.add("on");
document.querySelector(`[data-day="${day}"]`).classList.add("on");
render();
if(qs.get("dbg")==="1"){
  const w=document.querySelector(".wrap"),b=document.querySelector(".body"),
        st=document.querySelector(".stage"),pr=document.querySelector(".proto");
  const d=document.createElement("div");
  d.style.cssText="position:fixed;top:0;left:0;z-index:99;background:#000;color:#0f0;font:11px monospace;padding:4px;line-height:1.5;white-space:pre";
  d.textContent=[
   "innerW "+innerWidth+"  docClientW "+document.documentElement.clientWidth,
   "html.sW "+document.documentElement.scrollWidth+"  body.sW "+document.body.scrollWidth,
   "wrap "+w.offsetWidth+"  stage "+st.offsetWidth+"  body "+b.offsetWidth,
   "proto "+pr.offsetWidth+"  proto.sW "+pr.scrollWidth
  ].join("\n");
  document.body.appendChild(d);
}
</script>
</body>
</html>
